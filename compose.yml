services:
  postgres:
    image: postgres:16-alpine
    container_name: wap-postgres
    environment:
      POSTGRES_USER: wap
      POSTGRES_PASSWORD: wap
      POSTGRES_DB: wap
    ports:
      - "5432:5432"
    volumes:
      - wap_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wap -d wap"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: wap-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  wap_pgdata:
